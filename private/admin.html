<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#eee;font:14px system-ui}.wrap{width:min(1000px,92vw);margin:40px auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:28px;margin:0}button{cursor:pointer}.logout{background:none;color:#aaa;border:1px solid #333;padding:9px 12px;border-radius:8px}.upload{border:1px dashed #3b3b3b;border-radius:16px;padding:22px;background:#111;margin-bottom:28px}.upload form{display:flex;gap:10px;flex-wrap:wrap}input[type=file]{flex:1;min-width:220px;padding:12px;background:#090909;border:1px solid #292929;border-radius:9px;color:#aaa}.primary{border:0;border-radius:9px;padding:12px 20px;background:#eaff65;font-weight:700}.primary:disabled{opacity:.55;cursor:not-allowed}.status{margin:12px 0 0;color:#999}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#111;border:1px solid #222;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#090909;display:block}.card div{padding:10px}.delete{width:100%;border:1px solid #3a2424;background:#1a1010;color:#ff8c8c;border-radius:8px;padding:9px}a{color:#eaff65}</style></head><body><div class="wrap"><header><div><h1>Gallery Admin</h1><small><a href="/" target="_blank">View live showcase ↗</a></small></div><form method="post" action="/admin/logout"><button class="logout">Log out</button></form></header><section class="upload"><form id="upload"><input id="file" type="file" accept="image/*" multiple required><button class="primary" id="uploadBtn">Add work</button></form><p class="status" id="status">Select as many images as you need. They upload directly to Cloudinary.</p></section><section class="grid" id="grid"></section></div><script>
const grid=document.querySelector('#grid'),status=document.querySelector('#status'),fileInput=document.querySelector('#file'),uploadBtn=document.querySelector('#uploadBtn');

async function load(){
  const r=await fetch('/api/gallery');
  const j=await r.json();
  grid.innerHTML='';
  (j.images||[]).forEach(({url})=>{
    const c=document.createElement('article');c.className='card';
    const img=document.createElement('img');img.src=url;img.loading='lazy';
    const d=document.createElement('div');
    const b=document.createElement('button');b.className='delete';b.textContent='Delete';
    b.onclick=async()=>{
      if(!confirm('Delete this work?'))return;
      b.disabled=true;
      const r=await fetch('/api/gallery',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
      if(r.ok)load();else{b.disabled=false;alert('Delete failed')}
    };
    d.appendChild(b);c.append(img,d);grid.appendChild(c)
  })
}

fileInput.addEventListener('change',()=>{
  const count=fileInput.files.length;
  status.textContent=count?`${count} image${count===1?'':'s'} selected.`:'Select as many images as you need.'
});

async function getUploadConfig(){
  const r=await fetch('/api/upload-signature');
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||'Could not prepare upload.');
  return j;
}

async function uploadOne(file,cfg){
  const fd=new FormData();
  fd.append('file',file);
  fd.append('api_key',cfg.apiKey);
  fd.append('timestamp',String(cfg.timestamp));
  fd.append('signature',cfg.signature);
  fd.append('asset_folder',cfg.assetFolder);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(cfg.cloudName)}/image/upload`,{method:'POST',body:fd});
  const j=await r.json();
  if(!r.ok)throw new Error(j?.error?.message||`Upload failed for ${file.name}`);
  return {url:j.secure_url,publicId:j.public_id};
}

document.querySelector('#upload').onsubmit=async e=>{
  e.preventDefault();
  const files=[...fileInput.files];
  if(!files.length)return;
  uploadBtn.disabled=true;fileInput.disabled=true;
  try{
    const cfg=await getUploadConfig();
    let done=0;
    const settled=await Promise.allSettled(files.map(async file=>{
      const result=await uploadOne(file,cfg);
      done+=1;status.textContent=`Uploaded ${done} of ${files.length} to Cloudinary…`;
      return result;
    }));
    const assets=settled.filter(x=>x.status==='fulfilled').map(x=>x.value);
    const failures=settled.filter(x=>x.status==='rejected');
    if(assets.length){
      status.textContent=`Saving ${assets.length} image${assets.length===1?'':'s'} to gallery…`;
      const save=await fetch('/api/gallery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assets})});
      const saved=await save.json();
      if(!save.ok)throw new Error(saved.error||'Could not save gallery.');
      await load();
    }
    if(failures.length){
      status.textContent=`${assets.length} added, ${failures.length} failed. ${failures[0].reason?.message||''}`;
    }else{
      status.textContent=`${assets.length} image${assets.length===1?'':'s'} added successfully.`;
      e.target.reset();
    }
  }catch(err){
    status.textContent=err.message||'Upload failed.';
  }finally{
    uploadBtn.disabled=false;fileInput.disabled=false;
  }
};

load();
</script></body></html>
