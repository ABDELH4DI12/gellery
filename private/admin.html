<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#eee;font:14px system-ui}.wrap{width:min(1000px,92vw);margin:40px auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:28px;margin:0}button{cursor:pointer}.logout{background:none;color:#aaa;border:1px solid #333;padding:9px 12px;border-radius:8px}.upload{border:1px dashed #3b3b3b;border-radius:16px;padding:22px;background:#111;margin-bottom:28px}.upload form{display:flex;gap:10px;flex-wrap:wrap}input[type=file]{flex:1;min-width:220px;padding:12px;background:#090909;border:1px solid #292929;border-radius:9px;color:#aaa}.primary{border:0;border-radius:9px;padding:12px 20px;background:#eaff65;font-weight:700}.primary:disabled{opacity:.55;cursor:not-allowed}.status{margin:12px 0 0;color:#999}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#111;border:1px solid #222;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#090909;display:block}.card div{padding:10px}.delete{width:100%;border:1px solid #3a2424;background:#1a1010;color:#ff8c8c;border-radius:8px;padding:9px}a{color:#eaff65}</style></head><body><div class="wrap"><header><div><h1>Gallery Admin</h1><small><a href="/" target="_blank">View live showcase ↗</a></small></div><form method="post" action="/admin/logout"><button class="logout">Log out</button></form></header><section class="upload"><form id="upload"><input id="file" type="file" name="images" accept="image/*" multiple required><button class="primary" id="uploadBtn">Add work</button></form><p class="status" id="status">Select up to 10 images and upload them together.</p></section><section class="grid" id="grid"></section></div><script>const grid=document.querySelector('#grid'),status=document.querySelector('#status'),fileInput=document.querySelector('#file'),uploadBtn=document.querySelector('#uploadBtn');async function load(){const r=await fetch('/api/gallery');const j=await r.json();grid.innerHTML='';(j.images||[]).forEach(({url})=>{const c=document.createElement('article');c.className='card';const img=document.createElement('img');img.src=url;const d=document.createElement('div');const b=document.createElement('button');b.className='delete';b.textContent='Delete';b.onclick=async()=>{if(!confirm('Delete this work?'))return;const r=await fetch('/api/gallery',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});if(r.ok)load();else alert('Delete failed')};d.appendChild(b);c.append(img,d);grid.appendChild(c)})}fileInput.addEventListener('change',()=>{const count=fileInput.files.length;if(count>10){status.textContent='Please select a maximum of 10 images.';fileInput.value='';return}status.textContent=count?`${count} image${count===1?'':'s'} selected.`:'Select up to 10 images and upload them together.'});document.querySelector('#upload').onsubmit=async e=>{e.preventDefault();const files=[...fileInput.files];if(!files.length)return;if(files.length>10){status.textContent='Please select a maximum of 10 images.';return}status.textContent=`Uploading ${files.length} image${files.length===1?'':'s'}…`;uploadBtn.disabled=true;const fd=new FormData();files.forEach(file=>fd.append('images',file));try{const r=await fetch('/api/upload',{method:'POST',body:fd});const j=await r.json();status.textContent=r.ok?(j.message||'Uploaded successfully.'):(j.error||'Upload failed.');if(r.ok){e.target.reset();load()}}catch{status.textContent='Upload failed.'}finally{uploadBtn.disabled=false}};load();</script></body></html>
